  .plug { fill: #0969da; }
  .metal { fill: #8c959f; }
  .pill { fill: #0969da; }
  .wl .fb, .wl .fa { fill: #ffffff; }
  .wl .sb, .wl .sa, .wl .si { stroke: #ffffff; }
.nf{fill:none}.rd{stroke-linecap:round;stroke-linejoin:round}.w5{stroke-width:5}.w8{stroke-width:8}.w9{stroke-width:9}.w10{stroke-width:10}.w12{stroke-width:12}.w4{stroke-width:4}.w6{stroke-width:6}.w7{stroke-width:7}
  .dev { fill: #fff8c5; stroke: #bf8700; stroke-width: 2.2; stroke-dasharray: 8 6; }
  .chip { fill: #fff; stroke: #bf8700; stroke-width: 2; }
  .pin { stroke: #bf8700; stroke-width: 2.4; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .s { fill: #9198a1; }
    .mono { fill: #e6edf3; }
    .ok { fill: #7ee787; }
    .lap { fill: #21262d; stroke: #6e7681; }
    .screen { fill: #010409; }
    .cable { stroke: #4493f8; }
    .plug, .pill { fill: #1f6feb; }
    .metal { fill: #6e7681; }
    .dev { fill: #3d2e00; stroke: #d29922; }
    .chip { fill: #0d1117; stroke: #d29922; }
    .chipt { fill: #e6edf3; }
    .pin { stroke: #d29922; }
  }
  </style>
