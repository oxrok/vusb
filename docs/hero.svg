  <style>
  text { font-family: -apple-system, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-weight: 600; font-size: 19px; }
  .s { fill: #59636e; font-size: 15px; }
