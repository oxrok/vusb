[package]
name = "vusb"
description = "Virtual USB devices: a device model contract, class shells (HID, CDC-ACM, FTDI, EZ-USB), and the hosts that put a model on the bus (USB/IP with vhci-hcd, in-process)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["usb", "usbip", "emulation", "testing", "virtual-device"]
categories = ["hardware-support", "development-tools::testing", "emulators"]

[features]
default = ["usbip", "control"]
# The USB/IP server and the vhci-hcd attach path.
usbip = []
# Sessions and their control socket: JSON lines, from vusb-ctl or any client.
control = ["usbip", "dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true }

[lints]
workspace = true
