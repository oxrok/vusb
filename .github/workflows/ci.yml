name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --no-default-features
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  attach:
    # The real thing: a device on the machine through vhci-hcd. A hosted
    # kernel may have no package with the module: then this warns and checks
    # nothing, and tools/attach-check.sh is to be run by hand before a
    # release. Anything else that goes wrong fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: vhci
        name: Load vhci-hcd
        run: |
          sudo apt-get update
          sudo apt-get install -y usbutils
          package="linux-modules-extra-$(uname -r)"
          if apt-cache show "$package" >/dev/null 2>&1; then
            sudo apt-get install -y "$package"
          fi
          if sudo modprobe vhci-hcd; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::no vhci-hcd for kernel $(uname -r): the attach check did not run"
            echo "available=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.vhci.outputs.available == 'true'
        run: cargo build --workspace
      - if: steps.vhci.outputs.available == 'true'
        run: sudo -E sh tools/attach-check.sh

  qemu:
    # The device inside a guest: usbredir to QEMU's usb-redir device, the
    # guest built from the runner's own kernel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU and dracut
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 dracut-core
          sudo chmod a+r "/boot/vmlinuz-$(uname -r)"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          qemu-system-x86_64 -device help | grep usb-redir
      - run: cargo build --workspace
      - run: sh tools/qemu-check.sh cdc-echo
      - run: sh tools/qemu-check.sh ftdi-loopback
      - run: sh tools/qemu-check.sh hid-relay
      - if: failure()
        name: What the guest and QEMU said
        run: |
          for d in /tmp/vusb-qemu.*; do
            echo "=== $d"
            tail -n 60 "$d/console.log" || true
            cat "$d/qemu.log" "$d/vusb.err" || true
            tail -n 20 "$d/dracut.log" || true
          done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
