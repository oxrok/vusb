name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --no-default-features
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  attach:
    # The real thing: a device on the machine through vhci-hcd. A hosted
    # kernel may have no package with the module: then this warns and checks
    # nothing, and tools/attach-check.sh is to be run by hand before a
    # release. Anything else that goes wrong fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: vhci
        name: Load vhci-hcd
        run: |
          sudo apt-get update
          sudo apt-get install -y usbutils
          package="linux-modules-extra-$(uname -r)"
          if apt-cache show "$package" >/dev/null 2>&1; then
            sudo apt-get install -y "$package"
          fi
          if sudo modprobe vhci-hcd; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::no vhci-hcd for kernel $(uname -r): the attach check did not run"
            echo "available=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.vhci.outputs.available == 'true'
        run: cargo build --workspace
      - if: steps.vhci.outputs.available == 'true'
        run: sudo -E sh tools/attach-check.sh
      - if: steps.vhci.outputs.available == 'true'
        name: Record from the microphone (isochronous)
        run: |
          sudo apt-get install -y alsa-utils
          if sudo modprobe snd-usb-audio; then
            sudo -E sh tools/audio-check.sh
          else
            echo "::warning::no snd-usb-audio for kernel $(uname -r): the audio check did not run"
          fi
      - if: steps.vhci.outputs.available == 'true'
        name: Capture from the camera (isochronous, negotiated)
        run: |
          sudo apt-get install -y v4l-utils
          if sudo modprobe uvcvideo; then
            sudo -E sh tools/video-check.sh
          else
            echo "::warning::no uvcvideo for kernel $(uname -r): the video check did not run"
          fi
      - if: failure()
        name: Keep what the checks left
        run: |
          mkdir left
          sudo sh -c 'cp -r /tmp/tmp.* left/ && chmod -R a+rX left'
          sudo dmesg | tail -n 40
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: attach-checks
          path: left

  qemu:
    # The device inside a guest: usbredir to QEMU's usb-redir device. The
    # guest runs the distribution's generic kernel, which has the sound and
    # video drivers the runner's own lacks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU and dracut
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 dracut-core alsa-utils v4l-utils
          release=$(apt-cache depends linux-image-generic |
            sed -n 's/.*Depends: linux-image-\(.*-generic\)$/\1/p' | head -1)
          if [ -n "$release" ] && sudo apt-get install -y --no-install-recommends \
              "linux-image-$release"; then
            extra="linux-modules-extra-$release"
            if apt-cache show "$extra" >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends "$extra"
            fi
          else
            echo "::warning::no generic kernel to install: the guest runs $(uname -r)"
            release=$(uname -r)
          fi
          echo "VUSB_GUEST_KERNEL=$release" >>"$GITHUB_ENV"
          sudo chmod a+r "/boot/vmlinuz-$release"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          qemu-system-x86_64 -device help | grep usb-redir
      - run: cargo build --workspace
      - run: sh tools/qemu-check.sh cdc-echo
      - run: sh tools/qemu-check.sh ftdi-loopback
      - run: sh tools/qemu-check.sh hid-relay
      - name: The microphone, an isochronous stream
        run: |
          if modinfo -k "$VUSB_GUEST_KERNEL" snd-usb-audio >/dev/null 2>&1; then
            sh tools/qemu-check.sh uac-mic
          else
            echo "::warning::no snd-usb-audio for kernel $VUSB_GUEST_KERNEL: the guest cannot record"
          fi
      - name: The camera, a stream the guest negotiates
        run: |
          if modinfo -k "$VUSB_GUEST_KERNEL" uvcvideo >/dev/null 2>&1; then
            sh tools/qemu-check.sh uvc-cam
          else
            echo "::warning::no uvcvideo for kernel $VUSB_GUEST_KERNEL: the guest cannot capture"
          fi
      - if: failure()
        name: What the guest and QEMU said
        run: |
          for d in /tmp/vusb-qemu.*; do
            echo "=== $d"
            tail -n 60 "$d/console.log" || true
            cat "$d/qemu.log" "$d/vusb.err" || true
            tail -n 20 "$d/dracut.log" || true
          done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
